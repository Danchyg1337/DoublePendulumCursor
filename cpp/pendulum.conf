# Flying double-pendulum cursor -- configuration
# Edit values and restart the app. Lines starting with '#' are comments.
# Any key you remove falls back to its built-in default.

# ---- Geometry (pixels) ----
PIVOT_RADIUS = 5      # red dot: the true click point
BOB_RADIUS   = 3      # blue/green bobs
ROD_WIDTH    = 2
L1 = 20               # first arm length
L2 = 40               # second arm length

# ---- Masses & forces ----
M1 = 1.0
M2 = 1.0
G  = 2200             # base gravity (px/s^2); higher = snappier swing
FRICTION = 0.35       # velocity decay per second; 0 = frictionless & chaotic

# ---- Timing ----
SUBSTEPS = 6          # physics substeps per frame (stability)
FPS_CAP  = 240        # frame-rate ceiling
MONITOR_HZ = 0        # 0 = auto-detect refresh rate; else force e.g. 144
ACCEL_SMOOTHING = 0.25 # 0..1: higher = more responsive/jittery
MAX_ACCEL = 9000      # clamp on pivot acceleration

# ---- Colours (R,G,B) ----
COLOR_ROD   = 20,20,20
COLOR_PIVOT = 230,40,40
COLOR_BOB1  = 30,90,220
COLOR_BOB2  = 30,160,90

# ---- Snap behaviour ----
SNAP_STIFFNESS = 900       # forced homing spring (grace-period fallback)
WELL_RADIUS = 0.4          # rad: capture zone around a snap target
WELL_STIFFNESS = 122225    # gentle local attractor strength
SETTLE_ANGLE_TOL = 0.05    # rad: 'close enough' to lock
SETTLE_VEL_TOL = 0.3       # rad/s: 'slow enough' to lock
SNAP_GRACE_PERIOD = 0.5    # s a bob may fall in on its own before forcing

# ---- Snap-target angles (DEGREES) ----
# Measured from straight-down, positive = clockwise (screen coords).
HAND_THETA1    = -30    # hand/'pressable' triangle
HAND_THETA2    = 90
TEXT_THETA1    = 0      # text I-beam: vertical line
TEXT_THETA2    = 180
HRESIZE_THETA1 = -90    # horizontal resize: horizontal line
HRESIZE_THETA2 = 90
NWSE_THETA1    = -135   # diagonal resize "\": NW-SE line
NWSE_THETA2    = 45
NESW_THETA1    = 135    # diagonal resize "/": NE-SW line
NESW_THETA2    = -45
