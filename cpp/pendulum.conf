# Flying double-pendulum cursor -- configuration
# Edit values and restart the app. Lines starting with '#' are comments.
# Any key you remove falls back to its built-in default.
# (Per-cursor snap angles live in a separate cursors.conf.)

# ---- Geometry (pixels) ----
PIVOT_RADIUS = 5      # red dot: the true click point
BOB_RADIUS   = 3      # blue/green bobs
ROD_WIDTH    = 2
L1 = 20               # first arm length
L2 = 40               # second arm length

# ---- Masses & forces ----
M1 = 1.0
M2 = 1.0
G  = 2200             # base gravity (px/s^2); higher = snappier swing
FRICTION = 0.35       # velocity decay per second; 0 = frictionless & chaotic

# ---- Timing ----
SUBSTEPS = 6          # physics substeps per frame (stability)
FPS_CAP  = 240        # frame-rate ceiling
MONITOR_HZ = 0        # 0 = auto-detect refresh rate; else force e.g. 144
ACCEL_SMOOTHING = 0.25 # 0..1: higher = more responsive/jittery
MAX_ACCEL = 9000      # clamp on pivot acceleration

# ---- Colours (R,G,B) ----
COLOR_ROD   = 20,20,20
COLOR_PIVOT = 230,40,40
COLOR_BOB1  = 30,90,220
COLOR_BOB2  = 30,160,90

# ---- Snap behaviour ----
SNAP_STIFFNESS = 900       # forced homing spring (grace-period fallback)
WELL_RADIUS = 0.4          # rad: capture zone around a snap target
WELL_STIFFNESS = 122225    # gentle local attractor strength
SETTLE_ANGLE_TOL = 0.05    # rad: 'close enough' to lock
SETTLE_VEL_TOL = 0.3       # rad/s: 'slow enough' to lock
SNAP_GRACE_PERIOD = 0.5    # s a bob may fall in on its own before forcing

# ---- Beat dancer (BPMidentifier) ----
# Listens to the default output device. While music plays and its intensity
# is high enough, a .gifbpm GIF dances on the beat at the cursor's bottom-right.
DANCER_ENABLED = 1         # 0 = pendulum only, no audio capture
ACTORS_DIR = actors        # folder with .gifbpm files (relative = next to the exe)
GIF_SIZE = 160             # px: GIF is scaled to fit this box
GIF_OFFSET_X = 24          # px right of the pointer tip
GIF_OFFSET_Y = 24          # px below the pointer tip
SHOW_INTENSITY = 0.70      # 0 calm .. 1 intense: appear at/above this
HIDE_INTENSITY = 0.62      # disappear below this (no flicker at the edge)
BEAT_OFFSET_MS = 30        # shift the beat later to match audio output latency
FAST_DROP = 1              # 1 = show ~0.5 s after a drop; 0 = original BPMidentifier (~2 s)
MAX_BPM_DIFF = 50          # only GIFs within this many BPM of the music play, closest
                           # first (0 = any). GIFs are managed in tray -> Actors...
BEAT_LOCK = 1              # 1 = once the beat is found, lock it (vocals/fills can't drag it)
MUSIC_GATE = 1             # 1 = speech-only audio (videos, voice chat) never triggers a GIF
VOCAL_ROBUST = 1           # 1 = vocals don't lower the intensity

# ---- Debug ----
# DEBUG = 1 draws next to the cursor, always (even when no GIF shows):
#   BPM 128            detected tempo (-- = no beat)
#   I 0.72 SHOW        intensity (green..yellow..red); SHOW = GIF allowed
#   S 0.65 F 0.81*     2 s score, 0.5 s score; * = the 0.5 s score drove it
#   P 0.03 MUSIC       share of pauses in the last 3 s; VOICE = speech, no GIF
DEBUG = 0
DEBUG_LOG = 0              # 1 = also log those values 4x/s to debug_log.csv
