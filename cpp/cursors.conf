# Cursor snap poses -- one entry per line, loaded at startup.
#   <cursor> = <theta1_deg> , <theta2_deg>
# <cursor> is a friendly name (below) OR a raw numeric OCR id, so you can add
# new cursor types without recompiling. ':' works instead of '=', and
# parentheses around the angles are ignored.
#
# Angles are degrees measured from straight-down, positive = clockwise.
# For a straight line along a resize axis, make theta2 = theta1 + 180.
#
# Known names: hand (pressable), text (ibeam), vresize (sizens),
#              hresize (sizewe), nwse (sizenwse), nesw (sizenesw),
#              wait, cross, up, sizeall, no, appstarting, help.

hand    = -30, 90     # 'pressable' triangle
text    =   0, 180    # I-beam: vertical line (fold)
vresize =   0, 180    # vertical resize: vertical line
hresize = -90, 90     # horizontal resize: horizontal line
nwse    = -135, 45    # diagonal resize "\": NW-SE line
nesw    = 135, -45    # diagonal resize "/": NE-SW line

# Example: give the help cursor its own pose (uncomment to try)
# help  = 60, -60
